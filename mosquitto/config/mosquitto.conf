# Mosquitto MQTT Broker Configuration
# Part of home security AI system

# Listeners
listener 1883
listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Security - initial setup (allows anonymous connections for easier setup)
# IMPORTANT: For production use, uncomment the security section below
allow_anonymous true

# Production security (uncomment after initial setup and generate password file):
# password_file /mosquitto/config/passwd
# allow_anonymous false
# acl_file /mosquitto/config/acl

# To create password file, run:
# docker exec -it mqtt mosquitto_passwd -c /mosquitto/config/passwd <username>
# Then uncomment the password_file line above and set allow_anonymous to false
