services:
  # ============================================
  # MQTT BROKER - Central message bus
  # ============================================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # FRIGATE - NVR with GPU object detection
  # ============================================
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    container_name: frigate
    restart: unless-stopped
    privileged: true
    shm_size: "512mb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu, video, compute]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ${NFS_FRIGATE_PATH:-/mnt/synology/frigate}/recordings:/media/frigate/recordings
      - ${NFS_FRIGATE_PATH:-/mnt/synology/frigate}/clips:/media/frigate/clips
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
      - FRIGATE_DOORBELL_IP=${DOORBELL_IP}
      - FRIGATE_FLOODLIGHT_IP=${FLOODLIGHT_IP}
      - FRIGATE_HOST_IP=${HOST_IP}
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - CUDA_VISIBLE_DEVICES=1
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # NOTE: Face recognition is now handled natively by Frigate (see
  # frigate/config/config.yml -> face_recognition). The former CompreFace
  # (5 containers) + Double-Take stack was removed 2026-05-29.

  # ============================================
  # WHISPER - Speech-to-text (GPU 1)
  # ============================================
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: whisper
    restart: unless-stopped
    profiles:
      - full  # Only starts with --profile full
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=medium
      - ASR_ENGINE=faster_whisper

  # ============================================
  # PLATE RECOGNIZER - ALPR (optional)
  # ============================================
  platerecognizer:
    image: platerecognizer/alpr:latest
    container_name: platerecognizer
    restart: unless-stopped
    profiles:
      - full  # Only starts with --profile full
    ports:
      - "8001:8080"
    environment:
      - LICENSE_KEY=${PLATE_RECOGNIZER_KEY:-}
    volumes:
      - ./platerecognizer:/user-data

networks:
  default:
    name: security-stack
    driver: bridge
